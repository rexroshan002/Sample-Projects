<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Booklist</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="mesh-background">
    <div id="alert-container" class="position-fixed top-0 end-0 p-3" style="z-index: 1050;"></div>

    <div class="container mt-5">
        <div class="glass-panel p-4 p-md-5 mx-auto">
            <h1 class="display-5 text-center fw-bold mb-4 text-white d-flex align-items-center justify-content-center gap-2">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-accent">
                    <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>
                </svg>
                My<span class="text-accent">Frost </span>Pages
            </h1>
            
            <form id="book-form" class="mb-5">
                <div class="form-group mb-3">
                    <label for="title" class="form-label text-white-50 small text-uppercase tracking-wide">Title</label>
                    <input type="text" id="title" class="form-control glass-input" autocomplete="off">
                </div>
                <div class="form-group mb-3">
                    <label for="author" class="form-label text-white-50 small text-uppercase tracking-wide">Author</label>
                    <input type="text" id="author" class="form-control glass-input" autocomplete="off">
                </div>
                <div class="form-group mb-4">
                    <label for="isbn" class="form-label text-white-50 small text-uppercase tracking-wide">ISBN#</label>
                    <input type="text" id="isbn" class="form-control glass-input" autocomplete="off">
                </div>
                <button type="submit" class="btn w-100 glass-btn-primary fw-bold tracking-wide">Add Book</button>
            </form>

            <div class="table-responsive">
                <table class="table glass-table align-middle mb-0">
                    <thead>
                        <tr>
                            <th class="text-uppercase text-white-50 small">Title</th>
                            <th class="text-uppercase text-white-50 small">Author</th>
                            <th class="text-uppercase text-white-50 small">ISBN#</th>
                            <th class="text-end"></th>
                        </tr>
                    </thead>
                    <tbody id="book-list"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
