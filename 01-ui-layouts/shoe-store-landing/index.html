<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REX ROSHAN | Elite Retail Protocol</title>
    <link rel="stylesheet" href="./css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@900&display=swap" rel="stylesheet">
</head>
<body>

    <nav class="interface-controls" aria-label="Interface Controls">
        <button class="mode-switch" aria-label="Toggle Dark Mode" aria-pressed="false">
            <svg class="moon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </button>
    </nav>

    <main class="container">
        <article class="box" data-theme="green">
            <header class="name">
                <h2>Rex Shows New</h2>
            </header>
            <div class="circle" aria-hidden="true"></div>
            <img src="./img/green.webp" alt="Rex Neon Green Sneakers" class="product">
            <a href="#" class="buy">Shop Now</a>
        </article>

        <article class="box" data-theme="blue">
            <header class="name">
                <h2>Rex Shows New</h2>
            </header>
            <div class="circle" aria-hidden="true"></div>
            <img src="./img/blue.png" alt="Rex Electric Blue Sneakers" class="product">
            <a href="#" class="buy">Shop Now</a>
        </article>

        <article class="box" data-theme="red">
            <header class="name">
                <h2>Rex Shows New</h2>
            </header>
            <div class="circle" aria-hidden="true"></div>
            <img src="./img/red.webp" alt="Rex Crimson Red Sneakers" class="product">
            <a href="#" class="buy">Shop Now</a>
        </article>
    </main>

    <script src="./js/main.js" defer></script>
</body>
</html>
